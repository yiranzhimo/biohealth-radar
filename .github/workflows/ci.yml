name: Validate BioHealth Radar

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run validation
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests
          python3 scripts/validate_data.py
          python3 scripts/translate_company_sources.py --check
          python3 scripts/discover_companies.py --check
          python3 scripts/review_company_candidates.py --check
          python3 scripts/build_company_intelligence.py --check
          node --check app.js
          node --check data.js
          node --check company-intelligence.js
