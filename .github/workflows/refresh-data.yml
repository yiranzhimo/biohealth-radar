name: Refresh BioHealth Radar Data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply_needs_review:
        description: "Allow OpenAI high-confidence low-risk passes to clear needsReview"
        required: false
        type: boolean
        default: true
      force_review:
        description: "Re-review signals already reviewed under the current policy"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "refresh-data"
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4o-mini' }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      APPLY_NEEDS_REVIEW: ${{ github.event_name == 'schedule' || inputs.apply_needs_review }}
      FORCE_REVIEW: ${{ inputs.force_review }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify OpenAI configuration
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is unavailable to this job. Add it as a repository Actions secret, or as an environment secret for the github-pages environment."
            exit 1
          fi

      - name: Preserve previous data snapshot
        run: |
          cp data.js /tmp/biohealth-radar-data-previous.js

      - name: Collect PubMed
        run: |
          python3 scripts/collect_pubmed.py --days 365 --retmax 6 --max-total 24

      - name: Collect ClinicalTrials.gov
        run: |
          python3 scripts/collect_clinicaltrials.py --page-size 4 --max-total 24

      - name: Collect SEC EDGAR
        if: env.SEC_USER_AGENT != ''
        continue-on-error: true
        run: |
          python3 scripts/collect_sec_edgar.py --days 14 --max-total 80

      - name: Report disabled SEC collection
        if: env.SEC_USER_AGENT == ''
        run: |
          echo "SEC EDGAR collection is disabled. Set the SEC_USER_AGENT repository variable to enable it."

      - name: Preserve prior SEC signals
        run: |
          python3 scripts/preserve_source_signals.py --previous /tmp/biohealth-radar-data-previous.js --current data.js --id-prefix sec- --max-signals 120

      - name: Preserve prior AI reviews
        run: |
          python3 scripts/preserve_ai_reviews.py --previous /tmp/biohealth-radar-data-previous.js --current data.js

      - name: Run OpenAI pre-review
        run: |
          REVIEW_ARGS=(--all-pending)

          if [ "$FORCE_REVIEW" = "true" ]; then
            REVIEW_ARGS+=(--force)
          fi

          if [ "$APPLY_NEEDS_REVIEW" = "true" ]; then
            REVIEW_ARGS+=(--apply-needs-review --auto-clear-threshold 0.85)
          else
            echo "OpenAI results will not clear needsReview in this run."
          fi

          python3 scripts/review_with_openai.py "${REVIEW_ARGS[@]}"

      - name: Build company discovery and intelligence
        run: |
          python3 scripts/discover_companies.py
          python3 scripts/review_company_candidates.py
          python3 scripts/build_company_intelligence.py

      - name: Validate generated files
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests
          python3 scripts/validate_data.py
          python3 scripts/translate_company_sources.py --check
          python3 scripts/discover_companies.py --check
          python3 scripts/review_company_candidates.py --check
          python3 scripts/build_company_intelligence.py --check
          node --check app.js
          node --check data.js
          node --check company-intelligence.js

      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet -- data.js data/raw data/evidence.json data/programs.json data/company_mentions.json data/company_candidates.json data/company_candidate_reviews.json data/company_universe.json data/company_identity_links.json data/company_profiles.json company-intelligence.js; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/raw data/evidence.json data/programs.json data/company_mentions.json data/company_candidates.json data/company_candidate_reviews.json data/company_universe.json data/company_identity_links.json data/company_profiles.json company-intelligence.js
          git commit -m "Refresh BioHealth Radar data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "::error::Could not push refreshed data after 3 attempts."
              exit 1
            fi

            echo "Remote main changed; rebasing refreshed data before retry $((attempt + 1))/3."
            git fetch origin main
            git show origin/main:data.js > /tmp/biohealth-radar-data-remote.js
            python3 scripts/preserve_ai_reviews.py --previous /tmp/biohealth-radar-data-remote.js --current data.js
            python3 scripts/discover_companies.py
            python3 scripts/review_company_candidates.py
            python3 scripts/build_company_intelligence.py
            git add data.js data/raw/company_discovery_latest.json data/raw/company_candidate_reviews_latest.json data/evidence.json data/programs.json data/company_mentions.json data/company_candidates.json data/company_candidate_reviews.json data/company_universe.json data/company_profiles.json company-intelligence.js
            git commit --amend --no-edit
            git rebase -X theirs origin/main
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send failure notification
        if: ${{ failure() }}
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: python3 scripts/send_workflow_failure_email.py
